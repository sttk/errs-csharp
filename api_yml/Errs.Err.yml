  source:
    remote:
      path: Errs/Err.cs
      branch: 0.1.0
      repo: https://github.com/sttk/errs-csharp
    id: FixHandlers
    path: Errs/Err.cs
    startLine: 192
  assemblies:
  - Errs
  namespace: Errs
  summary: >-
    Prevents further addition of error handler object to synchronous and asynchronous exception

    handler lists. Before this is called, no <xref href="Errs.Err" data-throw-if-not-resolved="false"></xref> is notified to the handlers.

    After this is called, no new handlers can be added, and <xref href="Errs.Err" data-throw-if-not-resolved="false"></xref> is notified to

    the handlers.

    NOTE: This feature is enabled via the command line argument:

    <code>--github.sttk.errs.notify=true</code>
  example: []
  syntax:
    content: public static void FixHandlers()
    content.vb: Public Shared Sub FixHandlers()
  overload: Errs.Err.FixHandlers*
