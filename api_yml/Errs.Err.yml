  assemblies:
  - Errs
  namespace: Errs
  summary: >-
    Adds an <xref href="Errs.SyncErrHandler" data-throw-if-not-resolved="false"></xref> object which is executed synchronously just after an

    <xref href="Errs.Err" data-throw-if-not-resolved="false"></xref> is created. Handlers added with this method are executed in the order

    of addition and stop if one of the handlers throws an exception.

    NOTE: This feature is enabled via the command line argument:

    <code>--github.sttk.errs.notify=true</code>
  example: []
  syntax:
    content: public static void AddSyncHandler(SyncErrHandler handler)
    parameters:
    - id: handler
      type: Errs.SyncErrHandler
      description: An <xref href="Errs.SyncErrHandler" data-throw-if-not-resolved="false"></xref> object.
